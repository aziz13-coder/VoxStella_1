name: Packaged Runtime

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-package-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned uv and CPython
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.15"
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: backend/requirements-lock.txt
      - name: Verify pinned release runtime
        shell: cmd
        working-directory: frontend
        run: npm run verify:release-runtime
      - name: Verify package failure propagation
        shell: powershell
        run: scripts/test-package-app-failure.ps1
      - name: Package and smoke-test source runtime
        shell: cmd
        env:
          NO_OPEN_EXPLORER: "1"
        run: package-app-new.bat
      - name: Verify updater metadata and provenance
        shell: powershell
        run: |
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          & scripts/test-packaged-app.ps1 -WorkspaceRoot . -ExpectedVersion $version -RequireCleanBuild
          $metadata = Get-Content frontend/dist-electron/win-unpacked/resources/backend/runtime/horary_backend/_internal/build_metadata.json -Raw | ConvertFrom-Json
          if ($metadata.app_version -ne $version) { throw "Version mismatch" }
          if ($metadata.git.commit -ne $env:GITHUB_SHA) { throw "Commit mismatch" }
          if ($metadata.git.dirty -ne $false) { throw "Dirty packaged provenance" }
          if (-not (Test-Path frontend/dist-electron/win-unpacked/resources/app-update.yml)) {
            throw "app-update.yml missing"
          }
