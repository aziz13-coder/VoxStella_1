combo_matches:
  - "Sagittarius + 9th -> by a highway/large road, campus, or foreign venue; likely farther from LKP"
  - "Pisces/Neptune + 12th -> hotel/waterside/marina/hospital wing; concealed/controlled access"
  - "Gemini/Mercury + 3rd -> vehicle/local street/delivery route; easy access via neighborhood grid"
  - "Mercury in 12th (+Saturn) -> eavesdropping/old computer; keys/badges needed"
  - "Mars + 3rd (or ruling ASC) -> car/engine/garage; on-prem or curbside"
  - "2nd emphasis + Virgo/Mercury -> records/photos; personal effects/storage; adjacent room/locker"
  - "10th <-> perp ruler -> perp dwelling/authority building; their controlled place"
  - "Mars with Neptune (especially across 1st/7th or 5th) -> abduction vector; boats/fog-of-war complicate access"
  - "Planets near ASC + crowd -> on-site with many people; start inside before radiating outward"
  - "Libra/Venus + 9th -> law-themed street names near big roads; use for map narrowing"
  - "6th + Pisces/Virgo -> clinic/lab/service corridor; staff entrances/schedules"
  - "Scorpio + 12th -> locked rooms/storage/surveillance; plan keys/codes"
  - "ASC/IC heavy + home markers -> same building/lot; front door/threshold first sweep"
  - "Sagittarius/Jupiter on angle (female victim) -> partner figures; triage partner routine locales"

practical_use:
  - "Pick the house that owns the target (ASC/4th/3rd/9th/6th/12th)."
  - "Overlay the sign to push distance: Sagittarius -> farther/highway; Pisces -> hotel/water; Scorpio -> hidden."
  - "Add planet tells (Mars = cars/engines; Mercury = comms/electronics; Jupiter = bigger/farther)."
  - "Run a Tier A -> D sweep to conserve search time."
