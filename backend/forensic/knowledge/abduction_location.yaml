combo_rules_examples:
  - if: { house: 3, sign: Sagittarius }
    then: ["near a highway/bridge", "farther from last-seen point", "college/university corridor", "foreign-themed signage or street names"]
    why: "3rd = transit/roads; Sagittarius = highway/college/foreign."
  - if: { house: 12, sign: "Scorpio or Aquarius" }
    then: ["hidden area or secret room", "listening/eavesdropping tech nearby", "fast/early encounter if Aquarius/Uranus is prominent"]
    why: "12th = hidden/enemies; Scorpio = secrets; Aquarius/Uranus = fast/early."
  - if: { house: 5, sign: "Leo or Libra" }
    then: ["bar/club, entertainment venue", "fashion/beauty/crowd appeal settings"]
    why: "5th = bars/entertainment; Leo = stage/spotlight; Libra = social/beauty."
  - if: { house: 4, sign: Cancer }
    then: ["at the residence or just inside the front door", "domestic or family-linked items present"]
    why: "4th = home; Cancer = domestic setting."
  - if: { house: 9, sign: Libra }
    then: ["university/law campus", "street name may reference law or justice themes"]
    why: "9th = higher ed/long distance; Libra = law/justice; onomastic clues sometimes show."

field_map_howto: |
  How to read this: start with the house that most clearly owns the target (ASC/1st for the victim or object itself, 4th for premises/doors, 3rd/9th for routes, 6th/12th for institutions/confinement). Then let the sign and key planets modify distance and access difficulty.

tiers:
  A:
    title: "Tier A - Immediate vicinity / on-premises (easy access)"
    bullets:
      - "ASC / 1st emphasis -> immediate vicinity of the subject/crime scene"
      - "4th house / IC and its ruler -> inside property boundary; front/primary door"
  B:
    title: "Tier B - Local / adjacent (low-moderate access)"
    bullets:
      - "2nd, 5th, 11th (succedent) -> adjacent rooms/units; locker/personal storage"
      - "3rd house -> local routes and short hops; streets, vehicles, neighborhood movements"
  C:
    title: "Tier C - Transit corridors / extended search (moderate-hard access)"
    bullets:
      - "9th house -> long roads, interchanges, outdoor/open terrain"
      - "Sagittarius/Jupiter tie -> farther from last-seen; highway/campus"
  D:
    title: "Tier D - Institutional / concealed (hard access)"
    bullets:
      - "6th house -> workplaces, clinics, hospitals; controlled-access job sites/medical"
      - "12th house -> hidden/secluded, confinement/surveillance; covert tech/eavesdropping"

