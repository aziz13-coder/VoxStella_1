  Sagittarius_or_9th: ["farther/highway", "campus/university", "jurisdiction/distance"]
  Pisces_or_Neptune: ["hotels/waterfronts", "lost/missing/ambiguous", "distance by confusion"]
  Scorpio_or_12th: ["secrecy/hidden enemies", "access-controlled areas"]

