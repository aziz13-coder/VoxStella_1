# 3) Planets in the 4th — Outcome Signatures

Sun: "Visible, authoritative ending; leader/patriarch or official declaration."
Moon: "Domestic/familial closure; private decision, caretaking/emotional wrap."
Mercury: "Paperwork/recordings/signatures decide; technical/reversible terms."
Venus: "Settlement/appeasement; restitution/relationship equities; tidy finish."
Mars: "Forced stop; confrontation/expulsion; final blow/cut‑off action."
Jupiter: "Legalized closure/leniency; precedent/ethics; protections restored."
Saturn: "Hard stop by authority; penalties/duty; sober, enduring closure."
Uranus: "Break with past; abrupt pivot, reform, novel remedy/process change."
Neptune: "Dissolving fade‑out; mercy/cover‑up/ambiguity; withdrawal/surrender."
Pluto: "Irreversible purge/exposure; power dynamics, destruction → rebuild."
North Node: "Karmic hinge; intensifies/tilts the ending; use as a modifier."
South Node: "Karmic hinge; drains/releases; tilts the ending; use as a modifier."
