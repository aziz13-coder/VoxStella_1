# 4th House (IC) Ruler Placement — outcome / end-of-matter (forensic/event focus)
# Read “ruler of the 4th” = how things wrap up, who/what determines the close, and the tone of the ending.
# Below: what the outcome tends to look like when that ruler is placed in each house.

'1':
  outcome: "Self-determined close; the querent/victim/suspect’s own action, body, or identity finalizes matters; personal testimony or initiative is decisive."
'2':
  outcome: "Outcome via money/valuables; restitution, compensation, fines, asset recovery or loss; material security dictates the finish."
'3':
  outcome: "Paperwork, messages, siblings/neighbors, or short trips decide it; statements, records, or a confession/document tie the bow; plea agreements common."
'4':
  outcome: "Ends where it began; family/householder or property title settles it; a final return, burial/closure rites, or a domestic decision locks it in."
'5':
  outcome: "Children/romance/pleasure venues color the close; custody or paternity issues resolve it; creative evidence or ‘recreation of events’ clinches the ending."
'6':
  outcome: "Procedural/technical wrap; work/service/health facts—lab results, routines, co-workers—determine the finish; corrective measures and compliance orders."
'7':
  outcome: "Opponent/partner or the court decides; settlement, mediation, or adversary action forces closure; contracts/adjudication finalize."
'8':
  outcome: "Irreversible end; penalties, shared resources, insurance, debts, forensics, or matters of mortality decide it; exposure of what was hidden."
'9':
  outcome: "Law/precedent, higher authority, or distance/jurisdiction sets the finish; appeals, statutes, or institutional ethics call it; dismissal on principle possible."
'10':
  outcome: "Public, official, and final; authorities/agencies or reputation outcomes (charges, verdicts, professional rulings) seal it; career/office at stake."
'11':
  outcome: "Group consensus, community pressure, allies, informants—or benefits/payouts—resolve it; policy change or collective decision closes the matter."
'12':
  outcome: "Quiet fade or surrender; confinement/institutions, hidden actors, or self-undoing conclude it; leniency, secrecy, or withdrawal leaves loose ends."
