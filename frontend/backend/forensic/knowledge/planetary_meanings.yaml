Sun:
  general: Vitality, life-force, authority, visibility; the father, leaders
  crime: Open conflicts and adversaries (7th rulership in many charts), authorities involved, the heart
  afflicted: Abused authority, ego conflicts; heart stress or ailments

Moon:
  general: Emotions, habits, the public; the mother; flow and change
  crime: Victim’s emotional state, drugs, fluids; domestic scenes and family
  afflicted: Emotional instability, danger, erratic behavior; susceptibility to harm

Mercury:
  general: Communication, information, travel, youth; documents, vehicles, devices
  crime: Siblings, neighbors, psychiatric doctors, deception, forged papers, messages
  afflicted: Lies, misinformation, communication breakdown; theft, trickery, tampering

Venus:
  general: Love, beauty, harmony; valuables, jewelry, money; women
  crime: Female victims, romantic motives, relationship context; social encounters
  afflicted: Romantic rejection, jealousy, seduction leading to harm; valuables targeted

Mars:
  general: Aggression, surgery, sharp tools, fires; soldiers, athletes, weapons
  crime: Violence, bloodshed, weapons, male perpetrator; gunshots, stabbing, burns
  afflicted: Physical violence, injury, hostile pursuit, arson; inflammation

Jupiter:
  general: Expansion, law, clergy, foreign travel; judges, magnates
  crime: Law enforcement, legal process, long-distance movement; big money schemes
  afflicted: Excess, overconfidence, going too far; enabling or cover through status

Saturn:
  general: Limitation, time, bones; elderly, isolation, confinement, graves
  crime: Death, cruelty, blunt force, crushing, restriction, abandonment
  afflicted: Hardship, delay, decay; suffocation, hypoxia, exposure; starvation/neglect

Uranus:
  general: Sudden change, shock, electricity, technology; rebellion
  crime: Catastrophic accidents, explosions, electrical fires, abduction/sudden separation
  afflicted: Sudden violent events, erratic breakage; tasers/electrocution, blown circuits

Neptune:
  general: Confusion, dissolution, water, fog; anesthesia, intoxication, films
  crime: Deceit, overdose, addiction, drowning, disappearance (missing persons)
  afflicted: Cover-ups, poisonings, overdose; gas leaks, suffocation under fluids

Pluto:
  general: Underworld, coercion, control; transformation, extremity, hidden power
  crime: Destruction, upheaval, sexual assault, organized crime; forensic pathology
  afflicted: Complete annihilation, irreversible damage; body disposal, concealment

