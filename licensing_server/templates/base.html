<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vox Stella License Admin</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #0b1020; color: #e6e7ee; }
    .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 16px; }
    input, select, button { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background:#11152b; color:#e6e7ee; }
    button { cursor:pointer; background:#3b82f6; border:none; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    a { color: #93c5fd; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vox Stella — License Admin</h1>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
